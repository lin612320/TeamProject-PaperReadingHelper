<body>
<svg xmlns="http://www.w3.org/2000/svg" width="1840" height="1250" viewBox="0 0 1840 1250">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>

  <rect x="0" y="0" width="1840" height="1250" fill="#ffffff"/>

  <text x="44" y="52" font-size="27" font-weight="700" fill="#0f172a">PaperMind · 模块调用与数据传输（四条链路）</text>
  <text x="44" y="82" font-size="14.5" fill="#64748b">一行 = 一条链路；卡片颜色 = 该步骤属于哪个服务；箭头上的小字 = 那一段用的协议或关键数据</text>

  <!-- 图例 -->
  <rect x="1080" y="108" width="136" height="26" rx="7" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.6"/>
  <text x="1148" y="126" font-size="11.5" fill="#1d4ed8" text-anchor="middle">前端（浏览器）</text>
  <rect x="1224" y="108" width="136" height="26" rx="7" fill="#ecfdf5" stroke="#10b981" stroke-width="1.6"/>
  <text x="1292" y="126" font-size="11.5" fill="#047857" text-anchor="middle">backend Java</text>
  <rect x="1368" y="108" width="136" height="26" rx="7" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.6"/>
  <text x="1436" y="126" font-size="11.5" fill="#b45309" text-anchor="middle">ai-service Python</text>
  <rect x="1512" y="108" width="136" height="26" rx="7" fill="#fdf2f8" stroke="#db2777" stroke-width="1.6"/>
  <text x="1580" y="126" font-size="11.5" fill="#9d174d" text-anchor="middle">外部接口</text>
  <rect x="1656" y="108" width="136" height="26" rx="7" fill="#f8fafc" stroke="#64748b" stroke-width="1.6"/>
  <text x="1724" y="126" font-size="11.5" fill="#334155" text-anchor="middle">存储 / 返回</text>

  <!-- ================= A 行：上传入库 ================= -->
  <text x="44" y="206" font-size="25" font-weight="700" fill="#0f172a">A</text>
  <text x="44" y="232" font-size="14" font-weight="700" fill="#334155">上传入库</text>
  <text x="44" y="252" font-size="10.5" fill="#94a3b8">6 步 · 异步解析</text>
  <text x="44" y="270" font-size="10.5" fill="#94a3b8">前端 → Java → Python</text>
  <text x="44" y="288" font-size="10.5" fill="#94a3b8">→ postgres</text>

  <rect x="210" y="170" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="226" y="196" font-size="13.5" font-weight="700" fill="#1e3a8a">① 选文件并上传</text>
  <text x="226" y="217" font-size="10.5" fill="#1d4ed8">前端 · UploadView</text>
  <text x="226" y="243" font-size="11.5" fill="#334155">XHR（要进度条，fetch 没有</text>
  <text x="226" y="265" font-size="11.5" fill="#334155">progress 事件）</text>
  <text x="226" y="293" font-size="11.5" fill="#0f172a">→ multipart/form-data</text>

  <rect x="485" y="170" width="215" height="150" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="501" y="196" font-size="13.5" font-weight="700" fill="#065f46">② 校验并落盘</text>
  <text x="501" y="217" font-size="10.5" fill="#047857">backend · PaperController</text>
  <text x="501" y="243" font-size="11.5" fill="#334155">后缀 .pdf ＋ 前 4 字节 %PDF</text>
  <text x="501" y="265" font-size="11.5" fill="#334155">UUID 重命名存 uploads 卷</text>
  <text x="501" y="293" font-size="11.5" fill="#0f172a">→ INSERT papers(pending)</text>

  <rect x="760" y="170" width="215" height="150" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="776" y="196" font-size="13.5" font-weight="700" fill="#065f46">③ 异步转发解析</text>
  <text x="776" y="217" font-size="10.5" fill="#047857">backend · ParseService</text>
  <text x="776" y="243" font-size="11.5" fill="#334155">@Async，上传请求立刻返回</text>
  <text x="776" y="265" font-size="11.5" fill="#334155">HTTP/1.1 显式声明</text>
  <text x="776" y="293" font-size="11.5" fill="#0f172a">→ {paperId, filePath, force}</text>

  <rect x="1035" y="170" width="215" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1051" y="196" font-size="13.5" font-weight="700" fill="#92400e">④ 抽取 + 切片</text>
  <text x="1051" y="217" font-size="10.5" fill="#b45309">ai-service · ingest.py</text>
  <text x="1051" y="243" font-size="11.5" fill="#334155">PyMuPDF blocks，旋转先乘</text>
  <text x="1051" y="265" font-size="11.5" fill="#334155">rotation_matrix 再归一化 0~1</text>
  <text x="1051" y="293" font-size="11.5" fill="#0f172a">700 字上限 / 重叠 100 字</text>

  <rect x="1310" y="170" width="215" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1326" y="196" font-size="13.5" font-weight="700" fill="#92400e">⑤ 向量化并入库</text>
  <text x="1326" y="217" font-size="10.5" fill="#b45309">ai-service · embedder + db</text>
  <text x="1326" y="243" font-size="11.5" fill="#334155">bge-m3 → 1024 维，归一化</text>
  <text x="1326" y="265" font-size="11.5" fill="#334155">先 delete 旧切片再 insert</text>
  <text x="1326" y="293" font-size="11.5" fill="#0f172a">chunks 带 bbox 并集＋mode</text>

  <rect x="1585" y="170" width="215" height="150" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="1601" y="196" font-size="13.5" font-weight="700" fill="#1e293b">⑥ 回写状态</text>
  <text x="1601" y="217" font-size="10.5" fill="#475569">backend ← ai-service</text>
  <text x="1601" y="243" font-size="11.5" fill="#334155">{pageCount, chunkCount,</text>
  <text x="1601" y="265" font-size="11.5" fill="#334155">vectorDim, elapsedMs}</text>
  <text x="1601" y="293" font-size="11.5" fill="#0f172a">UPDATE ready ＋ 前端轮询</text>

  <line x1="425" y1="245" x2="481" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="453" y="236" font-size="9.5" fill="#334155" text-anchor="middle">:8081</text>
  <line x1="700" y1="245" x2="756" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="728" y="236" font-size="9.5" fill="#334155" text-anchor="middle">同进程</text>
  <line x1="975" y1="245" x2="1031" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1003" y="236" font-size="9.5" fill="#334155" text-anchor="middle">:8000</text>
  <line x1="1250" y1="245" x2="1306" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1278" y="236" font-size="9.5" fill="#334155" text-anchor="middle">进程内</text>
  <line x1="1525" y1="245" x2="1581" y2="245" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1553" y="236" font-size="9.5" fill="#334155" text-anchor="middle">回传</text>

  <!-- ================= B 行：单篇问答 ================= -->
  <text x="44" y="486" font-size="25" font-weight="700" fill="#0f172a">B</text>
  <text x="44" y="512" font-size="14" font-weight="700" fill="#334155">单篇问答</text>
  <text x="44" y="532" font-size="10.5" fill="#94a3b8">6 步 · 检索增强</text>
  <text x="44" y="550" font-size="10.5" fill="#94a3b8">前端 → Java → Python</text>
  <text x="44" y="568" font-size="10.5" fill="#94a3b8">→ pgvector → DeepSeek</text>

  <rect x="210" y="450" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="226" y="476" font-size="13.5" font-weight="700" fill="#1e3a8a">① 提问</text>
  <text x="226" y="497" font-size="10.5" fill="#1d4ed8">前端 · ReaderView</text>
  <text x="226" y="523" font-size="11.5" fill="#334155">AbortController 25s 超时</text>
  <text x="226" y="545" font-size="11.5" fill="#334155">可带用户自己的 Key</text>
  <text x="226" y="573" font-size="11.5" fill="#0f172a">→ {paperId, question}</text>

  <rect x="485" y="450" width="215" height="150" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="501" y="476" font-size="13.5" font-weight="700" fill="#065f46">② 先查库再转发</text>
  <text x="501" y="497" font-size="10.5" fill="#047857">backend · QaController</text>
  <text x="501" y="523" font-size="11.5" fill="#334155">空问题 / 超 500 字 → 1001</text>
  <text x="501" y="545" font-size="11.5" fill="#334155">parse_status≠ready → 409</text>
  <text x="501" y="573" font-size="11.5" fill="#0f172a">→ 固定 topK=3、引用 3 条</text>

  <rect x="760" y="450" width="215" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="776" y="476" font-size="13.5" font-weight="700" fill="#92400e">③ 向量检索</text>
  <text x="776" y="497" font-size="10.5" fill="#b45309">ai-service · RAG.search_chunks</text>
  <text x="776" y="523" font-size="11.5" fill="#334155">只查本篇 paper_id</text>
  <text x="776" y="545" font-size="11.5" fill="#334155">1-(embedding &lt;=&gt; q) 取前 3</text>
  <text x="776" y="573" font-size="11.5" fill="#0f172a">→ 相似度整体偏高（0.5 级）</text>

  <rect x="1035" y="450" width="215" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1051" y="476" font-size="13.5" font-weight="700" fill="#92400e">④ 两道拒答关卡</text>
  <text x="1051" y="497" font-size="10.5" fill="#b45309">ai-service · RAG</text>
  <text x="1051" y="523" font-size="11.5" fill="#334155">检索为空 → 拒答</text>
  <text x="1051" y="545" font-size="11.5" fill="#334155">相似度 &lt; 0.35 → 拒答</text>
  <text x="1051" y="573" font-size="11.5" fill="#0f172a">统一回“本文未涉及”</text>

  <rect x="1310" y="450" width="215" height="150" rx="11" fill="#fffbeb" stroke="#f59e0b" stroke-width="1.8"/>
  <text x="1326" y="476" font-size="13.5" font-weight="700" fill="#92400e">⑤ Prompt ＋ 调模型</text>
  <text x="1326" y="497" font-size="10.5" fill="#b45309">ai-service · llm_client</text>
  <text x="1326" y="523" font-size="11.5" fill="#334155">system 约束“没依据就说未涉及”</text>
  <text x="1326" y="545" font-size="11.5" fill="#334155">urllib 打 /chat/completions</text>
  <text x="1326" y="573" font-size="11.5" fill="#0f172a">temperature=0、stream=false</text>

  <rect x="1585" y="450" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="1601" y="476" font-size="13.5" font-weight="700" fill="#1e3a8a">⑥ 渲染答案与引用</text>
  <text x="1601" y="497" font-size="10.5" fill="#1d4ed8">前端</text>
  <text x="1601" y="523" font-size="11.5" fill="#334155">answer ＋ citations</text>
  <text x="1601" y="545" font-size="11.5" fill="#334155">{page, snippet, bbox×4, mode}</text>
  <text x="1601" y="573" font-size="11.5" fill="#0f172a">另带 tokenUsage 与耗时</text>

  <line x1="425" y1="525" x2="481" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="453" y="516" font-size="9.5" fill="#334155" text-anchor="middle">:8080</text>
  <line x1="700" y1="525" x2="756" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="728" y="516" font-size="9.5" fill="#334155" text-anchor="middle">/internal</text>
  <line x1="975" y1="525" x2="1031" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1003" y="516" font-size="9.5" fill="#334155" text-anchor="middle">进程内</text>
  <line x1="1250" y1="525" x2="1306" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1278" y="516" font-size="9.5" fill="#334155" text-anchor="middle">进程内</text>
  <line x1="1525" y1="525" x2="1581" y2="525" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1553" y="516" font-size="9.5" fill="#334155" text-anchor="middle">DeepSeek</text>

  <!-- ================= C 行：引用跳转 ================= -->
  <text x="44" y="766" font-size="25" font-weight="700" fill="#0f172a">C</text>
  <text x="44" y="792" font-size="14" font-weight="700" fill="#334155">引用跳转</text>
  <text x="44" y="812" font-size="10.5" fill="#94a3b8">5 步 · 结果消费侧</text>
  <text x="44" y="830" font-size="10.5" fill="#94a3b8">后端给坐标，</text>
  <text x="44" y="848" font-size="10.5" fill="#94a3b8">前端负责画准</text>

  <rect x="210" y="730" width="215" height="150" rx="11" fill="#f8fafc" stroke="#64748b" stroke-width="1.8"/>
  <text x="226" y="756" font-size="13.5" font-weight="700" fill="#1e293b">① 引用自带坐标</text>
  <text x="226" y="777" font-size="10.5" fill="#475569">后端响应 · citations</text>
  <text x="226" y="803" font-size="11.5" fill="#334155">bboxX0/Y0/X1/Y1 归一化 0~1</text>
  <text x="226" y="825" font-size="11.5" fill="#334155">bboxMode：precise/block/null</text>
  <text x="226" y="853" font-size="11.5" fill="#0f172a">片段取 chunk 前 200 字</text>

  <rect x="485" y="730" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="501" y="756" font-size="13.5" font-weight="700" fill="#1e3a8a">② 先跳页</text>
  <text x="501" y="777" font-size="10.5" fill="#1d4ed8">前端 · jumpToCitation</text>
  <text x="501" y="803" font-size="11.5" fill="#334155">平滑滚动到目标页</text>
  <text x="501" y="825" font-size="11.5" fill="#334155">页码非法则不跳</text>
  <text x="501" y="853" font-size="11.5" fill="#0f172a">跳页是坐标系的前置</text>

  <rect x="760" y="730" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="776" y="756" font-size="13.5" font-weight="700" fill="#1e3a8a">③ 再画框</text>
  <text x="776" y="777" font-size="10.5" fill="#1d4ed8">前端 · 高亮层</text>
  <text x="776" y="803" font-size="11.5" fill="#334155">bbox × 100% → 绝对定位层</text>
  <text x="776" y="825" font-size="11.5" fill="#334155">precise 实线 / block 虚线</text>
  <text x="776" y="853" font-size="11.5" fill="#0f172a">null 只闪一下页，不画框</text>

  <rect x="1035" y="730" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="1051" y="756" font-size="13.5" font-weight="700" fill="#1e3a8a">④ 自动淡出</text>
  <text x="1051" y="777" font-size="10.5" fill="#1d4ed8">前端</text>
  <text x="1051" y="803" font-size="11.5" fill="#334155">2.8 秒后移除高亮</text>
  <text x="1051" y="825" font-size="11.5" fill="#334155">快速连点先清上一个 timer</text>
  <text x="1051" y="853" font-size="11.5" fill="#0f172a">避免多个框叠在一起</text>

  <rect x="1310" y="730" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="1326" y="756" font-size="13.5" font-weight="700" fill="#1e3a8a">⑤ 缩放与旋转</text>
  <text x="1326" y="777" font-size="10.5" fill="#1d4ed8">前端 · 回归项</text>
  <text x="1326" y="803" font-size="11.5" fill="#334155">50% / 200% 重算定位</text>
  <text x="1326" y="825" font-size="11.5" fill="#334155">旋转 90/180/270 仍对齐</text>
  <text x="1326" y="853" font-size="11.5" fill="#0f172a">靠抽取侧已转好的坐标</text>

  <line x1="425" y1="805" x2="481" y2="805" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="453" y="796" font-size="9.5" fill="#334155" text-anchor="middle">JSON</text>
  <line x1="700" y1="805" x2="756" y2="805" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="728" y="796" font-size="9.5" fill="#334155" text-anchor="middle">页码</text>
  <line x1="975" y1="805" x2="1031" y2="805" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1003" y="796" font-size="9.5" fill="#334155" text-anchor="middle">坐标</text>
  <line x1="1250" y1="805" x2="1306" y2="805" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <text x="1278" y="796" font-size="9.5" fill="#334155" text-anchor="middle">计时</text>

  <!-- ================= D 行：检索导入 ================= -->
  <text x="44" y="1046" font-size="25" font-weight="700" fill="#0f172a">D</text>
  <text x="44" y="1072" font-size="14" font-weight="700" fill="#334155">检索导入</text>
  <text x="44" y="1092" font-size="10.5" fill="#94a3b8">6 步 · 外部入口</text>
  <text x="44" y="1110" font-size="10.5" fill="#94a3b8">前端 → Java → arXiv</text>
  <text x="44" y="1128" font-size="10.5" fill="#94a3b8">→ 并入 A 的解析链</text>

  <rect x="210" y="1010" width="215" height="150" rx="11" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.8"/>
  <text x="226" y="1036" font-size="13.5" font-weight="700" fill="#1e3a8a">① 关键词检索</text>
  <text x="226" y="1057" font-size="10.5" fill="#1d4ed8">前端 · SearchView</text>
  <text x="226" y="1083" font-size="11.5" fill="#334155">GET /api/search</text>
  <text x="226" y="1105" font-size="11.5" fill="#334155">?keyword&amp;source&amp;page&amp;size</text>
  <text x="226" y="1133" font-size="11.5" fill="#0f172a">source：arxiv 或 openalex</text>

  <rect x="485" y="1010" width="215" height="150" rx="11" fill="#ecfdf5" stroke="#10b981" stroke-width="1.8"/>
  <text x="501" y="1036" font-size="13.5" font-weight="700" fill="#065f46">② 先看缓存</text>
  <text x="501" y="1057" font-size="10.5" fill="#047857">backend · SearchController</text>
  <text x="501" y="1083" font-size="11.5" fill="#334155">key＝来源＋关键词哈希＋分页</text>
  <text x="501" y="1105" font-size="11.5" fill="#334155">TTL 24h，命中回 cached=true</text>
  <text x="501" y="1133" font-size="11.5" fill="#0f172a">时间戳用 Asia/Shanghai</text>

  <rect x="760" y="1010" width="215" height="150" rx="11" fill="#fdf2f8" stroke="#db2777" stroke-width="1.8"/>
  <text x="776" y="1036" font-size="13.5" font-weight="700" fill="#9d174d">③ 未命中查外部</text>
  <text x="776" y="1057" font-size="10.5" fill="#9d174d">backend · ArxivClient</text>
  <text x="776" y="1083" font-size="11.5" fill="#334155">Atom XML，禁 doctype/外部实体</text>
