# PaperMind 本地依赖编排
#
# 当前可用：postgres(pgvector) + redis
# 应用服务（frontend / backend / ai-service）待各自 Dockerfile 就绪后启用，
# 目标：一条 `docker compose up` 起全栈（Issue #2，负责人 P1）
#
# 用法：
#   docker compose up -d
#   docker compose ps
#   docker compose logs -f postgres
#   docker compose down          # 保留数据卷
#   docker compose down -v       # 连数据一起删

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papermind-postgres
    environment:
      POSTGRES_DB: papermind
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/03-数据库表结构.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: papermind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

