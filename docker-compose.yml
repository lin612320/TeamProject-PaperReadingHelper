# PaperMind 本地依赖编排
#
# 全栈：postgres(pgvector) + redis + backend + ai-service + frontend
# 一条 `docker compose up` 起全栈（Issue #2）
#
# 用法：
#   docker compose up -d           # 后台起全栈
#   docker compose up -d --build   # 改代码后重新构建镜像再起
#   docker compose ps              # 看每个服务是否 healthy
#   docker compose logs -f 服务名   # 看某个服务的实时日志
#   docker compose down            # 停掉，保留数据卷
#   docker compose down -v         # 停掉并连数据一起删
#
# 注意：
#   - 首次 `docker compose up` 要拉取/构建镜像：ai-service 的 torch 镜像约 2GB+，
#     frontend/node、backend/maven 镜像也不小，请留出时间耐心等待。
#   - 前端对外端口是 8081（不是本地 dev 的 5173）。

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: papermind-postgres
    environment:
      POSTGRES_DB: papermind
      POSTGRES_USER: papermind
      POSTGRES_PASSWORD: papermind_dev
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docs/03-数据库表结构.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U papermind -d papermind"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: papermind-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build: ./backend
    container_name: papermind-backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/papermind
      SPRING_DATASOURCE_USERNAME: papermind
      SPRING_DATASOURCE_PASSWORD: papermind_dev
      REDIS_HOST: redis
      REDIS_PORT: 6379
      AI_SERVICE_URL: http://ai-service:8000
    ports:
      - "8080:8080"
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/8080'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s
    restart: unless-stopped

  ai-service:
    build: ./ai-service
    container_name: papermind-ai
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://papermind:papermind_dev@postgres:5432/papermind
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      LLM_MODEL: ${LLM_MODEL:-deepseek-chat}
    ports:
      - "8000:8000"
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8000/internal/health', timeout=3).status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: papermind-frontend
    depends_on:
      - backend
    ports:
      - "8081:80"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

volumes:
  pgdata:
  redis-data:
  uploads:
  hf-cache:
