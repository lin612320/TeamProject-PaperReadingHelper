server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------
    # 上传体积上限（2026-11-06 补）
    # nginx 默认只收 1MB，而后端 Spring 的 max-request-size 是 55MB。
    # 不设这一行，用户传 1.2MB 的论文就会在 nginx 这层被 413 挡掉，
    # 请求根本到不了后端（本机 vite dev 代理没这个限制，所以开发时发现不了）。
    # ---------------------------------------------------------------------
    client_max_body_size 55m;

    # Vue Router 是 history 模式，刷新页面时回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 把 /api 请求转发给后端容器（8080）
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # 解析最长 180 秒，问答最长 25 秒；nginx 默认 60 秒会把长请求掐断
        proxy_read_timeout 200s;
        proxy_send_timeout 200s;
    }
}
