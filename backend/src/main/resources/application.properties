spring.application.name=papermind-backend
server.port=8080

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/papermind}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:papermind}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:papermind_dev}
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.servlet.multipart.max-file-size=50MB
spring.servlet.multipart.max-request-size=55MB
app.upload-dir=uploads
app.parse.mock=${APP_PARSE_MOCK:true}
app.parse.force=${APP_PARSE_FORCE:false}
app.ai-service.url=http://localhost:8000
